name: Build APK Remote

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant permissions for Gradle
      run: chmod +x gradlew

    - name: Assemble Debug APK
      run: ./gradlew :doom:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gzdoom-app-debug
        path: "**/build/outputs/apk/debug/*.apk"
