name: Build APK Remote

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant permissions for Gradle
      run: chmod +x gradlew

    - name: Assemble Debug APK
      run: ./gradlew :doom:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gzdoom-app-debug
        path: doom/build/outputs/apk/debug/*.apk
